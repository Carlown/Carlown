name: Update profile art

on:
  schedule:
    - cron: "23 16 * * *" # daily, 00:23 Beijing time
  workflow_dispatch: # or run it manually from the Actions tab
  push:
    branches: [main]
    paths:
      - profile.json
      - scripts/**
      - fonts/**
      - .github/workflows/update-profile.yml

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install "fonttools>=4.40"

      - name: Generate art (pull latest stars, contributions, languages)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data README.md
          if git diff --cached --quiet; then
            echo "No changes, skipping commit"
            exit 0
          fi
          git commit -m "🦀 Update profile art and data"
          git push
